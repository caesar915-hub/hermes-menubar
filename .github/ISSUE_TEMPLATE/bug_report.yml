name: 🐛 Bug Report
description: Report a defect or unexpected behavior in Hermes Menu Bar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: os_version
    attributes:
      label: macOS Version
      description: What version of macOS are you using? (e.g. macOS 14.5 Sonoma, macOS 15.0 Sequoia)
      placeholder: macOS 14.5
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Hermes Menu Bar Version
      description: What version of Hermes Menu Bar are you running? (e.g. v1.0.0)
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open Hermes Menu Bar
        2. Click on 'MM' profile icon
        3. Select 'Restart Gateway'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Copy any relevant lines from `gateway.log` or Console.app.
      render: shell
